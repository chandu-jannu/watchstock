<!DOCTYPE html>
<html lang="en">
  
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="StockSense — a modular inventory management system prototype">
<title>StockSense — Inventory Management</title>
<style>
  :root {  --bg: #f4f6f8;  --panel: #ffffff;  --text: #1a2230;  --muted: #6b7684;  --border: #e2e6ea;  --accent: #2f6feb;  --accent-ink: #ffffff;  --good: #1f8a4c;  --warn: #c97f0a;  --bad: #c93a3a;  box-sizing: border-box;  padding-top: env(safe-area-inset-top, 0px);  padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {  :root:not([data-theme="light"]) {    --bg: #10151c; --panel: #1a212b; --text: #e7ebf0; --muted: #8b95a3; --border: #2a323d;    --accent: #5b8def; --accent-ink: #0b1220; --good: #3fbf74; --warn: #e0a53a; --bad: #e0605b;  }
  }
  :root[data-theme="dark"] {  --bg: #10151c; --panel: #1a212b; --text: #e7ebf0; --muted: #8b95a3; --border: #2a323d;  --accent: #5b8def; --accent-ink: #0b1220; --good: #3fbf74; --warn: #e0a53a; --bad: #e0605b;
  }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  * { box-sizing: border-box; }
  body {  margin: 0;  min-height: 100%;  background: var(--bg);  color: var(--text);  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }

  header {  position: sticky;  top: 0;  z-index: 10;  display: flex;  align-items: center;  justify-content: space-between;  gap: 10px;  flex-wrap: wrap;  padding: calc(14px + env(safe-area-inset-top, 0px)) 18px 14px;  background: var(--panel);  border-bottom: 1px solid var(--border);
  }
  header h1 { margin: 0; font-size: 18px; }
  header .tag { font-size: 12px; color: var(--muted); }

  nav {  display: flex;  gap: 6px;  overflow-x: auto;  padding: 10px 18px;  background: var(--panel);  border-bottom: 1px solid var(--border);
  }
  nav button {  flex: none;  padding: 7px 12px;  border: 1px solid var(--border);  border-radius: 20px;  background: transparent;  color: var(--text);  font-size: 13px;  cursor: pointer;
  }
  nav button[aria-current="true"] {  background: var(--accent);  border-color: var(--accent);  color: var(--accent-ink);
  }

  main { max-width: 1100px; margin: 0 auto; padding: 16px 18px 60px; }

  .kpi-grid {  display: grid;  grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));  gap: 10px;  margin-bottom: 18px;
  }
  .kpi { padding: 12px 14px; background: var(--panel); border: 1px solid var(--border); border-radius: 12px; }
  .kpi .value { font-size: 22px; font-weight: 700; }
  .kpi .label { margin-top: 2px; font-size: 12px; color: var(--muted); }

  .panel {  margin-bottom: 16px;  padding: 14px;  background: var(--panel);  border: 1px solid var(--border);  border-radius: 12px;  overflow-x: auto;
  }
  .panel h2 { margin: 0 0 10px; font-size: 15px; }

  table { width: 100%; min-width: 520px; border-collapse: collapse; font-size: 13px; }
  th, td { padding: 7px 8px; border-bottom: 1px solid var(--border); text-align: left; white-space: nowrap; }
  th { font-size: 12px; font-weight: 600; color: var(--muted); }

  .badge { padding: 2px 8px; border-radius: 10px; font-size: 11px; font-weight: 600; }
  .badge-draft { background: color-mix(in srgb, var(--muted) 30%, transparent); color: var(--muted); }
  .badge-done { background: var(--good); color: #fff; }
  .badge-cancelled { background: var(--bad); color: #fff; }
  .badge-low { background: var(--warn); color: #fff; }
  .badge-out { background: var(--bad); color: #fff; }
  .badge-ok { background: var(--good); color: #fff; }

  form.doc-header, form.inline {  display: flex;  flex-wrap: wrap;  gap: 8px;  align-items: end;  margin-bottom: 12px;
  }
  .field label { display: block; margin-bottom: 3px; font-size: 11px; color: var(--muted); }
  input, select {  padding: 7px 9px;  border: 1px solid var(--border);  border-radius: 7px;  background: var(--bg);  color: var(--text);  font-size: 13px;
  }

  .btn {  padding: 7px 14px;  border: 1px solid var(--accent);  border-radius: 7px;  background: var(--accent);  color: var(--accent-ink);  font-size: 13px;  font-weight: 600;  cursor: pointer;
  }
  .btn.ghost { background: transparent; color: var(--accent); }
  .btn.danger { background: var(--bad); border-color: var(--bad); color: #fff; }
  .btn.small { padding: 4px 9px; font-size: 12px; }

  .line-editor { margin: 8px 0; padding: 10px; border: 1px dashed var(--border); border-radius: 8px; }
  .line-editor .row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-bottom: 8px; }

  .muted { font-size: 12px; color: var(--muted); }
  .empty { padding: 10px 0; font-size: 13px; color: var(--muted); }
  .doc-actions { display: flex; gap: 6px; }
</style>
</head>
<body>
<header>
  <div>  <h1>📦 StockSense</h1>  <div class="tag">Modular Inventory Management System</div>
  </div>
  <div class="tag" id="dateTag"></div>
</header>
<nav id="tabs" aria-label="Sections"></nav>
<main id="app"></main>

<script>
"use strict";



const STORAGE_KEY = "stocksense_state_v2";

function defaultState() {
  return {  seq: 1,  categories: [    { id: "c1", name: "Raw Material" },    { id: "c2", name: "Finished Goods" }  ],  warehouses: [{ id: "w1", name: "Main Warehouse" }],  locations: [    { id: "l1", name: "Rack A", warehouseId: "w1" },    { id: "l2", name: "Rack B", warehouseId: "w1" },    { id: "l3", name: "Production Floor", warehouseId: "w1" }  ],  products: [],  ledger: [],       // { id, productId, locationId, qty, docType, docId, ts }  receipts: [],     // { id, no, supplier, locationId, lines[], status, createdAt }  deliveries: [],   // { id, no, customer, locationId, lines[], status, createdAt }  transfers: [],    // { id, no, fromLocationId, toLocationId, lines[], status, createdAt }  adjustments: []   // { id, no, productId, locationId, countedQty, reason, status, createdAt }
  };
}

function loadState() {
  try {  const raw = localStorage.getItem(STORAGE_KEY);  if (raw) return JSON.parse(raw);
  } catch (err) {  console.error("Failed to load saved state, starting fresh.", err);
  }
  return defaultState();
}

let state = loadState();

function persist() {
  try {  localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  } catch (err) {  console.error("Failed to save state.", err);
  }
}

function nextId(prefix) {
  const id = prefix + state.seq;
  state.seq += 1;
  return id;
}

/*  STOCK LOGIC — every quantity on screen is computed from the ledger.  */

function stockOf(productId, locationId) {
  return state.ledger  .filter((entry) => entry.productId === productId && (!locationId || entry.locationId === locationId))  .reduce((sum, entry) => sum + entry.qty, 0);
}

function totalStock(productId) {
  return stockOf(productId, null);
}

function postLedgerEntry(productId, locationId, qty, docType, docId) {
  state.ledger.push({  id: nextId("ml"),  productId,  locationId,  qty,  docType,  docId,  ts: new Date().toISOString()
  });
}

/*  LOOKUPS  */

const findById = (list, id) => list.find((item) => item.id === id);
const productName = (id) => findById(state.products, id)?.name ?? "—";
const locationName = (id) => findById(state.locations, id)?.name ?? "—";
const categoryName = (id) => findById(state.categories, id)?.name ?? "—";
const warehouseName = (id) => findById(state.warehouses, id)?.name ?? "—";

function productOptions() {
  return state.products  .map((p) => `<option value="${p.id}">${p.name} (${p.sku})</option>`)  .join("");
}
function locationOptions() {
  return state.locations  .map((l) => `<option value="${l.id}">${l.name}</option>`)  .join("");
}
function categoryOptions() {
  return state.categories  .map((c) => `<option value="${c.id}">${c.name}</option>`)  .join("");
}
function warehouseOptions() {
  return state.warehouses  .map((w) => `<option value="${w.id}">${w.name}</option>`)  .join("");
}

/*  DOCUMENT LIFECYCLE — validating a document is the only way stock moves. Each validator re-checks availability at the moment of validation so stale drafts can never overdraw stock.  */

function validateReceipt(id) {
  const receipt = findById(state.receipts, id);
  if (!receipt || receipt.status !== "draft") return;
  receipt.lines.forEach((line) =>  postLedgerEntry(line.productId, receipt.locationId, line.qty, "receipt", receipt.id)
  );
  receipt.status = "done";
  persist();
  render();
}

function validateDelivery(id) {
  const delivery = findById(state.deliveries, id);
  if (!delivery || delivery.status !== "draft") return;

  for (const line of delivery.lines) {  const available = stockOf(line.productId, delivery.locationId);  if (available < line.qty) {    alert(      `Cannot validate: only ${available} unit(s) of ${productName(line.productId)} ` +      `available at ${locationName(delivery.locationId)}.`    );    return;  }
  }
  delivery.lines.forEach((line) =>  postLedgerEntry(line.productId, delivery.locationId, -line.qty, "delivery", delivery.id)
  );
  delivery.status = "done";
  persist();
  render();
}

function validateTransfer(id) {
  const transfer = findById(state.transfers, id);
  if (!transfer || transfer.status !== "draft") return;

  for (const line of transfer.lines) {  const available = stockOf(line.productId, transfer.fromLocationId);  if (available < line.qty) {    alert(      `Cannot validate: only ${available} unit(s) of ${productName(line.productId)} ` +      `available at ${locationName(transfer.fromLocationId)}.`    );    return;  }
  }
  transfer.lines.forEach((line) => {  postLedgerEntry(line.productId, transfer.fromLocationId, -line.qty, "transfer-out", transfer.id);  postLedgerEntry(line.productId, transfer.toLocationId, line.qty, "transfer-in", transfer.id);
  });
  transfer.status = "done";
  persist();
  render();
}

function validateAdjustment(id) {
  const adjustment = findById(state.adjustments, id);
  if (!adjustment || adjustment.status !== "draft") return;

  const current = stockOf(adjustment.productId, adjustment.locationId);
  const delta = adjustment.countedQty - current;
  if (delta !== 0) {  postLedgerEntry(adjustment.productId, adjustment.locationId, delta, "adjustment", adjustment.id);
  }
  adjustment.status = "done";
  persist();
  render();
}

function cancelDocument(collectionName, id) {
  const doc = findById(state[collectionName], id);
  if (!doc || doc.status !== "draft") return;
  doc.status = "cancelled";
  persist();
  render();
}

/*  UI HELPERS  */

function statusBadge(status) {
  const classes = { draft: "badge-draft", done: "badge-done", cancelled: "badge-cancelled" };
  return `<span class="badge ${classes[status]}">${status}</span>`;
}

function stockLevelBadge(qty, reorderPoint) {
  if (qty <= 0) return `<span class="badge badge-out">Out of stock</span>`;
  if (qty <= reorderPoint) return `<span class="badge badge-low">Low</span>`;
  return `<span class="badge badge-ok">OK</span>`;
}

function draftActions(collectionName, id, validateFnName) {
  return `<div class="doc-actions">    <button class="btn small" type="button" data-action="${validateFnName}" data-id="${id}">Validate</button>    <button class="btn small danger" type="button" data-action="cancel" data-collection="${collectionName}" data-id="${id}">Cancel</button>  </div>`;
}

/*  DRAFT LINE EDITOR — shared by Receipts, Deliveries, and Transfers. Holds the in-progress line items for whichever "new document" form is currently open, before the document itself is created.  */

let draftLines = [];

function addDraftLine(productId, qty) {
  if (!productId || !qty || qty <= 0) {  alert("Pick a product and enter a positive quantity.");  return;
  }
  draftLines.push({ productId, qty });
  render();
}

function removeDraftLine(index) {
  draftLines.splice(index, 1);
  render();
}

function renderLineEditor() {
  const rows = draftLines.length  ? `<table>      <tr><th>Product</th><th>Qty</th><th></th></tr>      ${draftLines        .map(          (line, i) => `<tr>            <td>${productName(line.productId)}</td>            <td>${line.qty}</td>            <td><button class="btn small danger" type="button" data-action="remove-line" data-index="${i}">Remove</button></td>          </tr>`        )        .join("")}    </table>`  : `<div class="muted">No lines added yet.</div>`;

  return `<div class="line-editor">    <div class="row">      <select id="lineProduct">${productOptions()}</select>      <input id="lineQty" type="number" min="1" step="1" placeholder="Qty" style="width:90px">      <button class="btn ghost small" type="button" data-action="add-line">+ Add line</button>    </div>    ${rows}  </div>`;
}

/*  TABS / ROUTER  */

const TABS = [
  ["dashboard", "Dashboard"],
  ["products", "Products"],
  ["receipts", "Receipts"],
  ["deliveries", "Deliveries"],
  ["transfers", "Transfers"],
  ["adjustments", "Adjustments"],
  ["ledger", "Move History"],
  ["settings", "Settings"]
];

let activeTab = "dashboard";

function renderTabs() {
  const nav = document.getElementById("tabs");
  nav.innerHTML = TABS.map(  ([key, label]) =>    `<button type="button" data-tab="${key}" aria-current="${key === activeTab}">${label}</button>`
  ).join("");
}

/*  VIEWS  */

function viewDashboard() {
  let lowCount = 0;
  let outCount = 0;
  state.products.forEach((p) => {  const qty = totalStock(p.id);  if (qty <= 0) outCount += 1;  else if (qty <= p.reorderPoint) lowCount += 1;
  });

  const pendingReceipts = state.receipts.filter((r) => r.status === "draft").length;
  const pendingDeliveries = state.deliveries.filter((d) => d.status === "draft").length;
  const pendingTransfers = state.transfers.filter((t) => t.status === "draft").length;

  const kpis = `<div class="kpi-grid">    <div class="kpi"><div class="value">${state.products.length}</div><div class="label">Total Products</div></div>    <div class="kpi"><div class="value">${lowCount + outCount}</div><div class="label">Low / Out of Stock</div></div>    <div class="kpi"><div class="value">${pendingReceipts}</div><div class="label">Pending Receipts</div></div>    <div class="kpi"><div class="value">${pendingDeliveries}</div><div class="label">Pending Deliveries</div></div>    <div class="kpi"><div class="value">${pendingTransfers}</div><div class="label">Transfers Scheduled</div></div>  </div>`;

  const stockTable = state.products.length  ? `<table>      <tr><th>SKU</th><th>Product</th><th>Category</th><th>Total Stock</th><th>Reorder Pt</th><th>Status</th></tr>      ${state.products        .map((p) => {          const qty = totalStock(p.id);          return `<tr>              <td>${p.sku}</td><td>${p.name}</td><td>${categoryName(p.categoryId)}</td>              <td>${qty} ${p.uom}</td><td>${p.reorderPoint}</td><td>${stockLevelBadge(qty, p.reorderPoint)}</td>            </tr>`;        })        .join("")}    </table>`  : `<div class="empty">No products yet — add one in the Products tab.</div>`;

  return `${kpis}<div class="panel"><h2>Stock by Product</h2>${stockTable}</div>`;
}

function viewProducts() {
  const form = `<div class="panel">    <h2>New Product</h2>    <form class="inline" data-form="create-product">      <div class="field"><label for="p-name">Name</label><input id="p-name" name="name" required></div>      <div class="field"><label for="p-sku">SKU / Code</label><input id="p-sku" name="sku" required></div>      <div class="field"><label for="p-category">Category</label><select id="p-category" name="category">${categoryOptions()}</select></div>      <div class="field"><label for="p-uom">Unit of Measure</label><input id="p-uom" name="uom" value="pcs"></div>      <div class="field"><label for="p-reorder">Reorder Point</label><input id="p-reorder" name="reorder" type="number" min="0" value="0"></div>      <button class="btn" type="submit">Add Product</button>    </form>  </div>`;

  const rows = state.products.length  ? `<table>      <tr><th>SKU</th><th>Name</th><th>Category</th><th>UoM</th><th>Reorder Pt</th><th>Total Stock</th></tr>      ${state.products        .map(          (p) => `<tr>            <td>${p.sku}</td><td>${p.name}</td><td>${categoryName(p.categoryId)}</td>            <td>${p.uom}</td><td>${p.reorderPoint}</td><td>${totalStock(p.id)}</td>          </tr>`        )        .join("")}    </table>`  : `<div class="empty">No products yet.</div>`;

  return `${form}<div class="panel"><h2>All Products</h2>${rows}</div>`;
}

/**
 * Shared "create document" panel for Receipts, Deliveries, and Transfers.
 * They differ only in header fields and labels — the line editor and
 * empty/no-products states are identical, so this factors out the duplication.
 */
function docCreatePanel({ title, formName, headerFieldsHtml, submitLabel }) {
  const disabledNotice = state.products.length  ? `<button class="btn" type="submit" form="${formName}">${submitLabel}</button>`  : `<div class="muted">Add products first in the Products tab.</div>`;

  return `<div class="panel">    <h2>${title}</h2>    <form class="doc-header" id="${formName}" data-form="${formName}">${headerFieldsHtml}</form>    ${renderLineEditor()}    ${disabledNotice}  </div>`;
}

function viewReceipts() {
  const create = docCreatePanel({  title: "New Receipt",  formName: "create-receipt",  submitLabel: "Create Receipt (Draft)",  headerFieldsHtml: `    <div class="field"><label for="r-supplier">Supplier</label><input id="r-supplier" name="supplier" placeholder="Supplier name"></div>    <div class="field"><label for="r-location">Receiving Location</label><select id="r-location" name="location">${locationOptions()}</select></div>`
  });

  const rows = state.receipts.length  ? `<table>      <tr><th>No.</th><th>Supplier</th><th>Location</th><th>Lines</th><th>Status</th><th></th></tr>      ${state.receipts        .slice()        .reverse()        .map(          (r) => `<tr>            <td>${r.no}</td><td>${r.supplier}</td><td>${locationName(r.locationId)}</td>            <td>${r.lines.map((l) => `${productName(l.productId)} ×${l.qty}`).join(", ")}</td>            <td>${statusBadge(r.status)}</td>            <td>${r.status === "draft" ? draftActions("receipts", r.id, "validate-receipt") : ""}</td>          </tr>`        )        .join("")}    </table>`  : `<div class="empty">No receipts yet.</div>`;

  return `${create}<div class="panel"><h2>Receipts</h2>${rows}</div>`;
}

function viewDeliveries() {
  const create = docCreatePanel({  title: "New Delivery Order",  formName: "create-delivery",  submitLabel: "Create Delivery (Draft)",  headerFieldsHtml: `    <div class="field"><label for="d-customer">Customer</label><input id="d-customer" name="customer" placeholder="Customer name"></div>    <div class="field"><label for="d-location">Ship From</label><select id="d-location" name="location">${locationOptions()}</select></div>`
  });

  const rows = state.deliveries.length  ? `<table>      <tr><th>No.</th><th>Customer</th><th>From</th><th>Lines</th><th>Status</th><th></th></tr>      ${state.deliveries        .slice()        .reverse()        .map(          (d) => `<tr>            <td>${d.no}</td><td>${d.customer}</td><td>${locationName(d.locationId)}</td>            <td>${d.lines.map((l) => `${productName(l.productId)} ×${l.qty}`).join(", ")}</td>            <td>${statusBadge(d.status)}</td>            <td>${d.status === "draft" ? draftActions("deliveries", d.id, "validate-delivery") : ""}</td>          </tr>`        )        .join("")}    </table>`  : `<div class="empty">No delivery orders yet.</div>`;

  return `${create}<div class="panel"><h2>Delivery Orders</h2>${rows}</div>`;
}

function viewTransfers() {
  const create = docCreatePanel({  title: "New Internal Transfer",  formName: "create-transfer",  submitLabel: "Create Transfer (Draft)",  headerFieldsHtml: `    <div class="field"><label for="t-from">From</label><select id="t-from" name="from">${locationOptions()}</select></div>    <div class="field"><label for="t-to">To</label><select id="t-to" name="to">${locationOptions()}</select></div>`
  });

  const rows = state.transfers.length  ? `<table>      <tr><th>No.</th><th>From</th><th>To</th><th>Lines</th><th>Status</th><th></th></tr>      ${state.transfers        .slice()        .reverse()        .map(          (t) => `<tr>            <td>${t.no}</td><td>${locationName(t.fromLocationId)}</td><td>${locationName(t.toLocationId)}</td>            <td>${t.lines.map((l) => `${productName(l.productId)} ×${l.qty}`).join(", ")}</td>            <td>${statusBadge(t.status)}</td>            <td>${t.status === "draft" ? draftActions("transfers", t.id, "validate-transfer") : ""}</td>          </tr>`        )        .join("")}    </table>`  : `<div class="empty">No transfers yet.</div>`;

  return `${create}<div class="panel"><h2>Internal Transfers</h2>${rows}</div>`;
}

function viewAdjustments() {
  const form = `<div class="panel">    <h2>New Stock Adjustment</h2>    <form class="inline" data-form="create-adjustment">      <div class="field"><label for="a-product">Product</label><select id="a-product" name="product">${productOptions()}</select></div>      <div class="field"><label for="a-location">Location</label><select id="a-location" name="location">${locationOptions()}</select></div>      <div class="field"><label for="a-counted">Counted Qty</label><input id="a-counted" name="counted" type="number" min="0" required></div>      <div class="field"><label for="a-reason">Reason</label><input id="a-reason" name="reason" placeholder="e.g. damaged, miscount"></div>      <button class="btn" type="submit">Create Adjustment (Draft)</button>    </form>  </div>`;

  const rows = state.adjustments.length  ? `<table>      <tr><th>No.</th><th>Product</th><th>Location</th><th>System Qty</th><th>Counted</th><th>Reason</th><th>Status</th><th></th></tr>      ${state.adjustments        .slice()        .reverse()        .map((a) => {          const systemQty = a.status === "draft" ? stockOf(a.productId, a.locationId) : "—";          return `<tr>            <td>${a.no}</td><td>${productName(a.productId)}</td><td>${locationName(a.locationId)}</td>            <td>${systemQty}</td><td>${a.countedQty}</td><td>${a.reason}</td>            <td>${statusBadge(a.status)}</td>            <td>${a.status === "draft" ? draftActions("adjustments", a.id, "validate-adjustment") : ""}</td>          </tr>`;        })        .join("")}    </table>`  : `<div class="empty">No adjustments yet.</div>`;

  return `${form}<div class="panel"><h2>Adjustments</h2>${rows}</div>`;
}

function viewLedger() {
  const rows = state.ledger.length  ? `<table>      <tr><th>Time</th><th>Product</th><th>Location</th><th>Qty Δ</th><th>Doc Type</th><th>Doc Ref</th></tr>      ${state.ledger        .slice()        .reverse()        .map((entry) => {          const sign = entry.qty >= 0 ? "+" : "";          return `<tr>            <td>${new Date(entry.ts).toLocaleString()}</td><td>${productName(entry.productId)}</td>            <td>${locationName(entry.locationId)}</td><td>${sign}${entry.qty}</td>            <td>${entry.docType}</td><td>${entry.docId}</td>          </tr>`;        })        .join("")}    </table>`  : `<div class="empty">No stock movements yet — validate a receipt, delivery, transfer, or adjustment to see entries here.</div>`;

  return `<div class="panel"><h2>Stock Ledger (Move History)</h2>${rows}</div>`;
}

function viewSettings() {
  const warehousesPanel = `<div class="panel">    <h2>Warehouses</h2>    <form class="inline" data-form="create-warehouse">      <div class="field"><label for="w-name">Warehouse Name</label><input id="w-name" name="name" required></div>      <button class="btn" type="submit">Add Warehouse</button>    </form>    <table><tr><th>Name</th></tr>${state.warehouses.map((w) => `<tr><td>${w.name}</td></tr>`).join("")}</table>  </div>`;

  const locationsPanel = `<div class="panel">    <h2>Locations</h2>    <form class="inline" data-form="create-location">      <div class="field"><label for="l-name">Location Name</label><input id="l-name" name="name" placeholder="e.g. Rack C" required></div>      <div class="field"><label for="l-warehouse">Warehouse</label><select id="l-warehouse" name="warehouse">${warehouseOptions()}</select></div>      <button class="btn" type="submit">Add Location</button>    </form>    <table>      <tr><th>Location</th><th>Warehouse</th></tr>      ${state.locations.map((l) => `<tr><td>${l.name}</td><td>${warehouseName(l.warehouseId)}</td></tr>`).join("")}    </table>  </div>`;

  const categoriesPanel = `<div class="panel">    <h2>Categories</h2>    <form class="inline" data-form="create-category">      <div class="field"><label for="c-name">Category Name</label><input id="c-name" name="name" required></div>      <button class="btn" type="submit">Add Category</button>    </form>    <table><tr><th>Name</th></tr>${state.categories.map((c) => `<tr><td>${c.name}</td></tr>`).join("")}</table>  </div>`;

  const dataPanel = `<div class="panel">    <h2>Data</h2>    <button class="btn danger" type="button" data-action="reset-data">Reset All Data</button>  </div>`;

  return warehousesPanel + locationsPanel + categoriesPanel + dataPanel;
}

/*  MAIN RENDER  */

const VIEWS = {
  dashboard: viewDashboard,
  products: viewProducts,
  receipts: viewReceipts,
  deliveries: viewDeliveries,
  transfers: viewTransfers,
  adjustments: viewAdjustments,
  ledger: viewLedger,
  settings: viewSettings
};

function render() {
  // Draft lines only make sense while a Receipt/Delivery/Transfer form is open.
  if (!["receipts", "deliveries", "transfers"].includes(activeTab)) {  draftLines = [];
  }
  renderTabs();
  document.getElementById("app").innerHTML = VIEWS[activeTab]();
}

/*  EVENT DELEGATION — one click listener and one submit listener handle every interactive element, matched by data-action / data-form attributes. This avoids inline event-handler attributes scattered through the markup.  */

document.getElementById("tabs").addEventListener("click", (event) => {
  const button = event.target.closest("[data-tab]");
  if (!button) return;
  activeTab = button.dataset.tab;
  render();
});

const VALIDATORS = {
  "validate-receipt": validateReceipt,
  "validate-delivery": validateDelivery,
  "validate-transfer": validateTransfer,
  "validate-adjustment": validateAdjustment
};

document.getElementById("app").addEventListener("click", (event) => {
  const target = event.target.closest("[data-action]");
  if (!target) return;
  const { action, id, collection, index } = target.dataset;

  if (action in VALIDATORS) {  VALIDATORS[action](id);
  } else if (action === "cancel") {  cancelDocument(collection, id);
  } else if (action === "add-line") {  const productId = document.getElementById("lineProduct").value;  const qty = Number(document.getElementById("lineQty").value);  addDraftLine(productId, qty);
  } else if (action === "remove-line") {  removeDraftLine(Number(index));
  } else if (action === "reset-data") {  if (confirm("Reset all data? This clears products, stock, and every document.")) {    localStorage.removeItem(STORAGE_KEY);    state = defaultState();    render();  }
  }
});

const FORM_HANDLERS = {
  "create-product": (form) => {  const name = form.name.value.trim();  const sku = form.sku.value.trim();  if (!name || !sku) return alert("Name and SKU are required.");  if (state.products.some((p) => p.sku === sku)) return alert("SKU already exists.");  state.products.push({    id: nextId("p"),    name,    sku,    categoryId: form.category.value,    uom: form.uom.value.trim() || "pcs",    reorderPoint: Number(form.reorder.value) || 0  });
  },

  "create-receipt": (form) => {  if (draftLines.length === 0) return alert("Add at least one line.");  state.receipts.push({    id: nextId("rc"),    no: "REC-" + state.seq,    supplier: form.supplier.value.trim() || "Unknown Supplier",    locationId: form.location.value,    lines: draftLines.slice(),    status: "draft",    createdAt: new Date().toISOString()  });  draftLines = [];
  },

  "create-delivery": (form) => {  if (draftLines.length === 0) return alert("Add at least one line.");  state.deliveries.push({    id: nextId("do"),    no: "DO-" + state.seq,    customer: form.customer.value.trim() || "Walk-in Customer",    locationId: form.location.value,    lines: draftLines.slice(),    status: "draft",    createdAt: new Date().toISOString()  });  draftLines = [];
  },

  "create-transfer": (form) => {  if (draftLines.length === 0) return alert("Add at least one line.");  const from = form.from.value;  const to = form.to.value;  if (from === to) return alert("Source and destination must differ.");  state.transfers.push({    id: nextId("tr"),    no: "TR-" + state.seq,    fromLocationId: from,    toLocationId: to,    lines: draftLines.slice(),    status: "draft",    createdAt: new Date().toISOString()  });  draftLines = [];
  },

  "create-adjustment": (form) => {  const countedQty = form.counted.value;  if (countedQty === "") return alert("Enter counted quantity.");  state.adjustments.push({    id: nextId("adj"),    no: "ADJ-" + state.seq,    productId: form.product.value,    locationId: form.location.value,    countedQty: Number(countedQty),    reason: form.reason.value.trim() || "Physical count",    status: "draft",    createdAt: new Date().toISOString()  });
  },

  "create-warehouse": (form) => {  const name = form.name.value.trim();  if (!name) return;  state.warehouses.push({ id: nextId("w"), name });
  },

  "create-location": (form) => {  const name = form.name.value.trim();  if (!name) return;  state.locations.push({ id: nextId("l"), name, warehouseId: form.warehouse.value });
  },

  "create-category": (form) => {  const name = form.name.value.trim();  if (!name) return;  state.categories.push({ id: nextId("c"), name });
  }
};

document.getElementById("app").addEventListener("submit", (event) => {
  const form = event.target.closest("[data-form]");
  if (!form) return;
  event.preventDefault();
  const handler = FORM_HANDLERS[form.dataset.form];
  if (!handler) return;
  handler(form);
  persist();
  render();
});

/*  BOOT  */

document.getElementById("dateTag").textContent = new Date().toLocaleDateString(undefined, {
  weekday: "short",
  year: "numeric",
  month: "short",
  day: "numeric"
});

render();
</script>
